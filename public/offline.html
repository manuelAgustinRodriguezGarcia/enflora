<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2A" />
    <title>Sin conexión | Enflora</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        background: #f4f8ee;
        color: #1f3129;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(28rem, 100%);
        padding: 1.5rem 1.25rem;
        border: 1px solid #dce5d8;
        border-radius: 1.25rem;
        background: #fff;
        text-align: center;
      }
      .aviso {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto;
        border-radius: 999px;
        background: #f8edd4;
        color: #9a5410;
      }
      .aviso svg { width: 2.4rem; height: 2.4rem; }
      h1 {
        margin: 0.8rem 0 0.4rem;
        color: #0b3d2a;
        font-size: 1.7rem;
        letter-spacing: -0.03em;
      }
      p { margin: 0; color: #68766f; line-height: 1.45; }
      button {
        margin-top: 1.2rem;
        min-height: 3rem;
        padding: 0 1.2rem;
        border: 0;
        border-radius: 999px;
        background: #0b3d2a;
        color: #f4f8ee;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="aviso" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"
          />
          <path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 16.5h.008" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>Enflora no puede cargar esta pantalla ahora. Tus cultivos siguen guardados: cuando vuelva la red, tocá reintentar.</p>
      <button type="button" id="reintentar">Reintentar</button>
    </main>
    <script>
      document.getElementById("reintentar").addEventListener("click", function () {
        if (navigator.onLine === false) return;
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
