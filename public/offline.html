<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2A" />
    <title>Sin conexión | Enflora</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        background: #f4f8ee;
        color: #1f3129;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(28rem, 100%);
        padding: 1.5rem 1.25rem;
        border: 1px solid #dce5d8;
        border-radius: 1.25rem;
        background: #fff;
        text-align: center;
      }
      img { width: 4.5rem; height: 4.5rem; }
      h1 {
        margin: 0.8rem 0 0.4rem;
        color: #0b3d2a;
        font-size: 1.7rem;
        letter-spacing: -0.03em;
      }
      p { margin: 0; color: #68766f; line-height: 1.45; }
      button {
        margin-top: 1.2rem;
        min-height: 3rem;
        padding: 0 1.2rem;
        border: 0;
        border-radius: 999px;
        background: #0b3d2a;
        color: #f4f8ee;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/enflora-isotipo-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Enflora no puede cargar esta pantalla ahora. Tus cultivos siguen guardados: cuando vuelva la red, tocá reintentar.</p>
      <button type="button" id="reintentar">Reintentar</button>
    </main>
    <script>
      document.getElementById("reintentar").addEventListener("click", function () {
        if (navigator.onLine === false) return;
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
